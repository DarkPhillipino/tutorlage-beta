<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tutorlage - Book a Tutor & Educational Platform</title>
    <meta name="description" content="Find expert tutors, group classes, exam prep, and homework help at your institution." />
    <meta property="og:title" content="Tutorlage - Educational Platform" />
    <meta property="og:description" content="Find expert tutors, group classes, exam prep, and homework help at your institution." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Old github.io links carry /tutorlage-beta/ in front of the page; GitHub forwards them to tutorlage.com
      // with that prefix kept, so drop it before the app starts.
      (function () {
        var p = location.pathname;
        if (p === '/tutorlage-beta' || p.indexOf('/tutorlage-beta/') === 0) {
          history.replaceState(null, '', (p.slice('/tutorlage-beta'.length) || '/') + location.search + location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
