name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Served from the root of tutorlage.com, so no GITHUB_PAGES (it would build for /tutorlage-beta/).
          # Publishable key: RLS-enforced, safe to expose in a client build.
          # Production ("Tutorlage Production", qxzhqylrrspumvguflwj) since 31 Oct 2026; the dev project is wfpjoxetbprmllqqarwp.
          VITE_SUPABASE_URL: "https://qxzhqylrrspumvguflwj.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_b6VSzQyqjjxMjA7gjMLXjg_doeo859L"
          # The payments API on Cloudflare Workers (server/worker.ts, wrangler.jsonc). Pages has no /api.
          VITE_API_BASE_URL: "https://tutorlage-api.pakisosetunku.workers.dev"
          # Payments are dropped for now (CEO, 28 Oct 2026): booking says "Payments are not open yet" and the tutor's bank-details box
          # is hidden. Delete this line when payments return (src/lib/features.ts, PAYMENTS_NOT_OPEN).
          VITE_PAYMENTS_NOT_OPEN: "1"
      # GitHub Pages has no server-side routing. `npm run build` ends with scripts/postbuild.ts, which writes a real file for each public
      # address (dist/login.html, dist/signup/tutor.html, ... answered with status 200), dist/404.html for every other address (the app
      # shows its "We can't find that page" screen), sitemap.xml and robots.txt. Do not copy index.html over 404.html here.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
