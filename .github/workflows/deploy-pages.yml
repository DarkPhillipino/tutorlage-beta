name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          # Publishable key: RLS-enforced, safe to expose in a client build.
          VITE_SUPABASE_URL: "https://wfpjoxetbprmllqqarwp.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_uYCOWKWJoWh4hlXH22H_cQ_gKHZ5n3l"
      # GitHub Pages has no server-side routing: copying index.html to 404.html
      # lets deep links (e.g. /login) resolve to the app instead of a hard 404,
      # so React Router can take over client-side.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
